name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Public values (the same ones shipped in the web app's JS bundle). Never put the service-role key here.
      EXPO_PUBLIC_SUPABASE_URL: https://faotlhoqovswyfysbwma.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhb3RsaG9xb3Zzd3lmeXNid21hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjQzNTYsImV4cCI6MjA5MzQ0MDM1Nn0.3RBRyO2NZJ_D3t3vss0JBZucUXFVi8SbirtGi759HuM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BharathBuild-apk
          path: android/app/build/outputs/apk/release/*.apk
